name: offline-tests
# Credential-free: tools/run_offline_tests.py blocks sockets and blanks UPSTOX_ACCESS_TOKEN.
# Tests that need locally generated market data (data/, gitignored) skip themselves on a clean checkout;
# see docs/OPERATIONS_PHASE_0B.md. No secrets are configured or required.
on:
  push:
  pull_request:
concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]          # the versions the suite has actually been run on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install base and CPU-only deep learning dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt matplotlib
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
      - name: Lint and type-check
        run: |
          python -m pip install ruff mypy
          ruff check src tests tools
          mypy
      - name: Show which test modules are eligible
        run: python tools/run_offline_tests.py --list
      - name: Run offline suite
        run: python tools/run_offline_tests.py
